<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seguimiento CETI — Hospital San Roque</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<style>
  :root{
    --paper:#0B0F14;
    --paper-2:#0F141B;
    --surface:#141B24;
    --ink:#E7EAEE;
    --ink-soft:#8B93A3;
    --teal:#6C63FF;
    --teal-deep:#8B84FF;
    --teal-pale:#211E42;
    --mustard:#F2B33D;
    --mustard-pale:#3A2E12;
    --brick:#F87171;
    --brick-pale:#3A1518;
    --moss:#34D399;
    --moss-pale:#0F2A21;
    --line:#232B36;
    --white:#FCFAF5;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'IBM Plex Sans', sans-serif;
    font-size:15px;
    line-height:1.5;
  }
  h1,h2,h3{ font-family:'Source Serif 4', serif; font-weight:600; margin:0; color:var(--ink); }
  .mono{ font-family:'IBM Plex Mono', monospace; }
  .wrap{ max-width:960px; margin:0 auto; padding:28px 20px 80px; }

  header.top{ border-bottom:2px solid var(--teal-deep); padding-bottom:18px; margin-bottom:22px; display:flex; align-items:center; gap:16px; }
  header.top img.logo{ width:56px; height:56px; flex-shrink:0; }
  header.top h1{ font-size:28px; letter-spacing:-0.01em; }
  header.top p{ margin:6px 0 0; color:var(--ink-soft); font-size:14px; max-width:60ch; }

  .roletabs{ display:flex; gap:2px; margin:20px 0 18px; border-bottom:1px solid var(--line); }
  .roletab{
    padding:9px 18px; cursor:pointer; font-size:14px; color:var(--ink-soft);
    border:1px solid transparent; border-bottom:none; background:none; font-family:inherit;
    position:relative; top:1px;
  }
  .roletab.active{
    color:var(--teal-deep); font-weight:600; background:var(--surface);
    border-color:var(--line); border-bottom:1px solid var(--surface);
  }

  .toolbar{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:18px; }
  .toolbar input[type=text]{
    flex:1; min-width:180px; padding:9px 11px; border:1px solid var(--line); background:var(--surface);
    font-family:inherit; font-size:14px; color:var(--ink); border-radius:2px;
  }
  select{ padding:9px 11px; border:1px solid var(--line); background:var(--surface); font-family:inherit; font-size:14px; border-radius:2px; color:var(--ink); }

  button{ font-family:inherit; cursor:pointer; border-radius:2px; }
  .btn{
    padding:9px 16px; background:var(--teal); color:var(--white); border:1px solid var(--teal);
    font-size:14px; font-weight:500;
  }
  .btn:hover{ background:var(--teal-deep); }
  .btn.secondary{ background:var(--surface); color:var(--teal-deep); border:1px solid var(--teal-deep); }
  .btn.secondary:hover{ background:var(--teal-pale); }
  .btn.danger{ background:var(--surface); color:var(--brick); border:1px solid var(--brick); }
  .btn.danger:hover{ background:var(--brick-pale); }
  .btn.small{ padding:5px 11px; font-size:12.5px; }
  .btn:disabled{ opacity:.4; cursor:not-allowed; }

  .stats{ display:flex; gap:1px; background:var(--line); border:1px solid var(--line); margin-bottom:20px; }
  .stat{ flex:1; background:var(--surface); padding:12px 14px; }
  .stat .n{ font-family:'Source Serif 4',serif; font-size:24px; color:var(--teal-deep); font-weight:600; }
  .stat .l{ font-size:12px; color:var(--ink-soft); margin-top:2px; }

  .expediente{
    background:var(--surface); border:1px solid var(--line); border-left:5px solid var(--teal);
    padding:16px 18px; margin-bottom:12px; cursor:pointer;
  }
  .expediente:hover{ border-left-color:var(--teal-deep); }
  .expediente.no_aprobado{ border-left-color:var(--brick); }
  .expediente.aprobado{ border-left-color:var(--moss); }
  .expediente.pendiente{ border-left-color:var(--mustard); }
  .exp-top{ display:flex; justify-content:space-between; align-items:baseline; gap:12px; flex-wrap:wrap; }
  .exp-top h3{ font-size:17px; }
  .exp-meta{ font-size:12.5px; color:var(--ink-soft); margin-top:3px; }
  .badge{
    font-size:11.5px; padding:3px 9px; border-radius:2px; white-space:nowrap; font-weight:500;
    background:var(--teal-pale); color:var(--teal-deep);
  }
  .badge.no_aprobado{ background:var(--brick-pale); color:var(--brick); }
  .badge.aprobado{ background:var(--moss-pale); color:var(--moss); }
  .badge.pendiente{ background:var(--mustard-pale); color:var(--mustard); }
  .badge.neutral{ background:var(--paper-2); color:var(--ink-soft); border:1px solid var(--line); }

  .resultado-chips{ display:flex; gap:8px; flex-wrap:wrap; margin-top:9px; }
  .resultado-chip{ font-size:12px; padding:4px 10px; border-radius:2px; }

  .stepper{ display:flex; align-items:center; margin-top:12px; }
  .step{ display:flex; flex-direction:column; align-items:center; flex:1; position:relative; }
  .step .dot{ width:11px; height:11px; border-radius:50%; background:var(--line); border:2px solid var(--line); z-index:1; }
  .step.done .dot{ background:var(--teal); border-color:var(--teal); }
  .step.current .dot{ background:var(--surface); border-color:var(--mustard); }
  .step.warn .dot{ background:var(--surface); border-color:var(--brick); }
  .step .lbl{ font-size:10.5px; color:var(--ink-soft); margin-top:5px; text-align:center; }
  .step:not(:last-child)::after{
    content:''; position:absolute; top:5px; left:50%; width:100%; height:2px; background:var(--line); z-index:0;
  }
  .step.done:not(:last-child)::after{ background:var(--teal); }

  .empty{ padding:40px 20px; text-align:center; color:var(--ink-soft); border:1px dashed var(--line); background:var(--surface); }

  .panel{ background:var(--surface); border:1px solid var(--line); padding:22px; margin-bottom:16px; }
  .panel h2{ font-size:20px; margin-bottom:4px; }
  .back{ background:none; border:none; color:var(--teal-deep); font-size:13px; padding:0; margin-bottom:14px; text-decoration:underline; }

  .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .field{ margin-bottom:12px; }
  .field label{ display:block; font-size:12.5px; color:var(--ink-soft); margin-bottom:4px; }
  .field input, .field select, .field textarea{
    width:100%; padding:9px 11px; border:1px solid var(--line); background:var(--paper); font-family:inherit; font-size:14px; border-radius:2px; color:var(--ink);
  }
  .field textarea{ min-height:64px; resize:vertical; }

  .divider{ border:none; border-top:1px solid var(--line); margin:20px 0; }
  .section-title{ font-size:13px; text-transform:none; color:var(--teal-deep); font-weight:600; margin-bottom:10px; letter-spacing:.01em; }

  .round{ border:1px solid var(--line); padding:12px 14px; margin-bottom:10px; background:var(--paper); }
  .round-top{ display:flex; justify-content:space-between; font-size:12.5px; color:var(--ink-soft); margin-bottom:6px; }
  .round-body{ font-size:13.5px; }
  .round-body p{ margin:3px 0; }

  .doc-item{ display:flex; align-items:center; gap:10px; border:1px solid var(--line); background:var(--paper); padding:10px 12px; margin-bottom:8px; }
  .doc-item .doc-info{ flex:1; min-width:0; }
  .doc-item .doc-name{ font-size:13.5px; font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .doc-item .doc-meta{ font-size:11.5px; color:var(--ink-soft); margin-top:2px; }
  .doc-item .doc-actions{ display:flex; gap:6px; flex-shrink:0; }

  .curso-card{ background:var(--surface); border:1px solid var(--line); border-left:5px solid var(--teal); padding:16px 18px; margin-bottom:12px; cursor:pointer; }
  .curso-card:hover{ border-left-color:var(--teal-deep); }
  .curso-card h3{ font-size:17px; }
  .curso-card p{ font-size:13.5px; color:var(--ink-soft); margin:6px 0 0; }
  .curso-meta{ display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }

  .video-wrap{ position:relative; padding-top:56.25%; height:0; overflow:hidden; background:var(--paper-2); border:1px solid var(--line); margin:14px 0; }
  .video-wrap iframe{ position:absolute; top:0; left:0; width:100%; height:100%; border:0; }

  .biblio-item{ font-size:13.5px; padding:8px 0; border-bottom:1px solid var(--line); }
  .biblio-item:last-child{ border-bottom:none; }
  .biblio-item a{ color:var(--teal-deep); }

  .quiz-q{ border:1px solid var(--line); background:var(--paper); padding:14px 16px; margin-bottom:12px; }
  .quiz-q .q-titulo{ font-weight:500; margin-bottom:8px; }
  .quiz-q label{ display:block; font-size:13.5px; padding:4px 0; cursor:pointer; }
  .quiz-q.correcta{ border-left:4px solid var(--moss); }
  .quiz-q.incorrecta{ border-left:4px solid var(--brick); }
  .quiz-score{ font-family:'Source Serif 4',serif; font-size:22px; color:var(--teal-deep); margin-bottom:14px; }

  .resultado-row{ display:flex; justify-content:space-between; font-size:13.5px; padding:8px 0; border-bottom:1px solid var(--line); }

  .comentario{ border-bottom:1px solid var(--line); padding:12px 0; }
  .comentario:last-child{ border-bottom:none; }
  .comentario-top{ display:flex; justify-content:space-between; align-items:baseline; gap:10px; }
  .comentario-nombre{ font-weight:600; font-size:13.5px; }
  .comentario-fecha{ font-size:11.5px; color:var(--ink-soft); }
  .comentario-texto{ font-size:13.5px; margin-top:4px; white-space:pre-wrap; }
  .resultado-row:last-child{ border-bottom:none; }

  .warn-box{ background:var(--brick-pale); border:1px solid var(--brick); color:var(--brick); padding:10px 13px; font-size:13px; margin-bottom:12px; }
  .info-box{ background:var(--teal-pale); border:1px solid var(--teal); color:var(--teal-deep); padding:10px 13px; font-size:13px; margin-bottom:12px; }

  .overlay{
    position:fixed; inset:0; background:rgba(34,32,27,.45); display:none; align-items:flex-start; justify-content:center;
    padding:40px 16px; overflow-y:auto; z-index:50;
  }
  .overlay.open{ display:flex; }
  .modal{ background:var(--surface); border:1px solid var(--line); max-width:520px; width:100%; padding:24px; }
  .modal h2{ font-size:19px; margin-bottom:16px; }
  .modal-actions{ display:flex; gap:10px; justify-content:flex-end; margin-top:18px; }

  .ref-toggle{ font-size:12.5px; color:var(--teal-deep); text-decoration:underline; background:none; border:none; padding:0; margin-bottom:16px; }
  .ref-box{ display:none; font-size:13px; color:var(--ink-soft); background:var(--paper-2); border:1px solid var(--line); padding:14px 16px; margin-bottom:16px; }
  .ref-box.open{ display:block; }
  .ref-box p{ margin:6px 0; }

  footer.foot{ margin-top:40px; font-size:12px; color:var(--ink-soft); border-top:1px solid var(--line); padding-top:14px; display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; }

  /* ---- Pantalla de login / registro ---- */
  .auth-screen{
    position:fixed; inset:0; width:100%; height:100%;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px;
    padding:24px; box-sizing:border-box; overflow:auto; z-index:100;
    background: linear-gradient(160deg, #0B1C2C 0%, #0E2438 45%, #123049 100%);
  }
  .auth-screen::before{
    content:''; position:absolute; inset:0; pointer-events:none;
    background-image: repeating-linear-gradient(115deg, rgba(94,234,212,0.07) 0 2px, transparent 2px 42px);
  }
  .auth-shell{
    position:relative; z-index:1; width:100%; max-width:860px;
    display:flex; border-radius:16px; overflow:hidden; box-shadow:0 30px 70px rgba(0,0,0,.4);
    min-height:460px;
  }
  .auth-brand{
    flex:1 1 42%; background:#fff; display:flex; align-items:center; justify-content:center; padding:32px;
  }
  .auth-brand img{ max-width:220px; width:100%; height:auto; }
  .auth-card{
    flex:1 1 58%; background:#0F1B29; padding:40px 44px; display:flex; flex-direction:column; justify-content:center;
  }
  .auth-eyebrow{ display:flex; align-items:center; gap:6px; font-size:11px; letter-spacing:.08em; color:#5EEAD4; text-transform:uppercase; margin-bottom:10px; font-weight:600; }
  .auth-eyebrow::before{ content:''; width:6px; height:6px; border-radius:50%; background:#5EEAD4; }
  .auth-module-row{ display:flex; align-items:center; gap:12px; margin-bottom:18px; }
  .auth-badge{
    width:46px; height:46px; border-radius:10px; flex-shrink:0; display:flex; align-items:center; justify-content:center;
    font-family:'Source Serif 4', serif; font-weight:700; font-size:15px; color:#fff; letter-spacing:.02em;
    background: linear-gradient(135deg, #6C63FF, #4338CA);
  }
  .auth-card h2{ font-size:24px; color:#F3F4F6; margin:0; }
  .auth-card p.sub{ color:#9CA3AF; font-size:13px; margin:16px 0 22px; padding-top:16px; border-top:1px solid #223042; }
  .auth-cred-label{ font-size:12px; color:#9CA3AF; margin-bottom:14px; }
  .auth-field{ margin-bottom:13px; }
  .auth-field label{ display:block; font-size:11px; color:#9CA3AF; margin-bottom:4px; text-transform:uppercase; letter-spacing:.05em; }
  .auth-field input{
    width:100%; padding:11px 13px; border:1px solid #2A3B4E; border-radius:8px; font-family:inherit; font-size:14px;
    box-sizing:border-box; background:#EEF1F8; color:#1F2937;
  }
  .auth-submit{
    width:100%; padding:13px; margin-top:8px; border:none; border-radius:8px; color:#fff; font-weight:600; font-size:14px;
    background: linear-gradient(90deg, #14B8A6, #2563EB); cursor:pointer;
  }
  .auth-submit:hover{ filter:brightness(1.08); }
  .auth-toggle{ text-align:center; margin-top:16px; font-size:13px; color:#9CA3AF; }
  .auth-toggle a{ color:#5EEAD4; cursor:pointer; text-decoration:underline; }
  .auth-error{ background:#3A1518; color:#F87171; border-radius:8px; padding:9px 12px; font-size:13px; margin-bottom:14px; }
  .auth-footnote{ text-align:center; margin-top:16px; font-size:12.5px; color:#6B7A8C; position:relative; z-index:1; }

  /* ---- Selector de módulos (pantalla de entrada) ---- */
  .lanz-shell{ position:relative; z-index:1; width:100%; max-width:860px; display:flex; border-radius:16px; overflow:hidden; box-shadow:0 30px 70px rgba(0,0,0,.4); min-height:420px; }
  .lanz-brand{ flex:1 1 38%; background:#fff; display:flex; align-items:center; justify-content:center; padding:32px; }
  .lanz-brand img{ max-width:200px; width:100%; height:auto; }
  .lanz-panel{ flex:1 1 62%; background:#0F1B29; padding:36px 40px; display:flex; flex-direction:column; justify-content:center; }
  .lanz-eyebrow{ font-size:11px; letter-spacing:.1em; color:#5EEAD4; text-transform:uppercase; font-weight:600; margin-bottom:6px; }
  .lanz-panel h2{ font-size:24px; color:#F3F4F6; margin:0 0 22px; }
  .lanz-row{ display:flex; align-items:center; gap:14px; background:#141F2E; border:1px solid #223042; border-radius:10px; padding:14px 16px; margin-bottom:12px; }
  .lanz-row-icon{ width:38px; height:38px; border-radius:8px; background:#1B2A3D; display:flex; align-items:center; justify-content:center; flex-shrink:0; color:#5EEAD4; }
  .lanz-row-titulo{ flex:1; font-size:15px; font-weight:600; color:#F3F4F6; }
  .lanz-btn{ display:inline-flex; align-items:center; gap:6px; padding:9px 16px; border:none; border-radius:8px; color:#fff; font-weight:600; font-size:13.5px; cursor:pointer; background:linear-gradient(90deg,#14B8A6,#2563EB); }
  .lanz-btn:hover{ filter:brightness(1.08); }
  .lanz-disclaimer{ position:relative; z-index:1; max-width:860px; width:100%; margin-top:18px; background:#2E2208; border:1px solid #B98536; color:#F1E3C8; border-radius:10px; padding:13px 18px; font-size:13px; display:flex; gap:10px; align-items:flex-start; }

  @media (max-width:640px){
    .lanz-shell{ flex-direction:column; max-width:380px; }
    .lanz-brand{ padding:26px; }
    .lanz-brand img{ max-width:150px; }
  }

  @media (max-width:640px){
    .auth-shell{ flex-direction:column; max-width:380px; }
    .auth-brand{ padding:28px; }
    .auth-brand img{ max-width:160px; }
  }

  @media (max-width:560px){
    .grid2{ grid-template-columns:1fr; }
    .stats{ flex-wrap:wrap; }
    .stat{ min-width:45%; }
  }

  .lock-btn{ margin-left:auto; font-size:12.5px; color:var(--ink-soft); background:none; border:none; text-decoration:underline; padding:9px 4px; cursor:pointer; }

  @media print{
    header.top, .roletabs, .toolbar, .back, .lock-btn, footer.foot, .btn, input, select, .ref-toggle{ display:none !important; }
    body{ background:#fff; }
    .panel{ border:1px solid #999; break-inside:avoid; }
    .expediente{ break-inside:avoid; }
  }
</style>
</head>
<body>
<div class="wrap" id="app">Cargando…</div>

<div class="overlay" id="overlay">
  <div class="modal" id="modalBody"></div>
</div>

<script>
/* ---------------- conexión a Supabase ---------------- */
// La URL, la clave y la contraseña de CETI se configuran en config.js
// (así no hay que tocar este archivo para cambiarlas).
const sb = window.supabase.createClient(window.CETI_CONFIG.url, window.CETI_CONFIG.anonKey);
const BUCKET = 'adjuntos';

let state = {
  session: null,
  isAdmin: false,
  isCalidad: false,
  authChecked: false,
  authMode: 'login',
  filterBiblio: '',
  moduloElegido: null, // null | 'capacitaciones' | 'investigacion' — elegido en el selector de entrada
  role: 'alumno',
  trabajos: [],
  capacitaciones: [],
  residentes: [],
  loaded: false,
  loadError: false,
  filterText: '',
  filterEstado: '',
  selectedId: null,
  selectedCursoId: null,
  quizResultado: null,
  miNombre: localStorage.getItem('ceti_mi_nombre') || ''
};

const TIPOS = [
  'Proyecto de investigación',
  'Trabajo de Investigación',
  'Monografía',
  'Presentación de Caso Clínico',
  'Trabajo de Revisión Bibliográfica',
  'Presentación en actividad científica (Congreso/Jornada)'
];

const ADJUNTO_CATEGORIAS = [
  'Proyecto de investigación',
  'Trabajo final',
  'Consentimiento informado',
  'Compromiso de confidencialidad',
  'Hoja de evaluación',
  'Otro / Anexo'
];

const TAMANO_MAX_MB = 20; // Supabase free tier permite hasta 50 MB por archivo; dejamos margen
const UMBRAL_APROBACION = 0.6; // 60% de respuestas correctas (ej: 6 de 10) para aprobar el cuestionario
function esAprobado(puntaje, total){ return total > 0 && (puntaje/total) >= UMBRAL_APROBACION; }

function uid(){ return Math.random().toString(36).slice(2,10) + Date.now().toString(36); }
function today(){ return new Date().toISOString().slice(0,10); }
function fmtDate(d){ if(!d) return '—'; const [y,m,day]=d.split('-'); return day+'/'+m+'/'+y; }
function esc(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function nuevoTrabajo(datos){
  return {
    id: uid(),
    titulo: datos.titulo,
    tipo: datos.tipo,
    investigador: { nombre: datos.nombre, servicio: datos.servicio, anio: datos.anio, email: datos.email },
    director: datos.director,
    numeroIngreso: '',
    fechaIngreso: '',
    requiereCIEIS: null, // null = sin definir, true/false
    cieisAprobado: false,
    proyecto: { rounds: [] },
    trabajoFinal: { rounds: [] },
    entrega: { copias:false, firmaCETI:false, firmaCCDI:false, fecha:'' },
    adjuntos: [],
    autorizaDifusion: false,
    fechaAutorizacion: '',
    createdAt: Date.now(),
    updatedAt: Date.now()
  };
}

/* ---------------- storage (Supabase) ---------------- */
async function loadData(){
  const [resTrabajos, resCursos, resResidentes] = await Promise.all([
    sb.from('trabajos').select('*').order('created_at', { ascending:false }),
    sb.from('capacitaciones').select('*').order('created_at', { ascending:false }),
    sb.from('residentes').select('*').order('created_at', { ascending:false })
  ]);

  if(resTrabajos.error){
    console.error(resTrabajos.error);
    state.loadError = true;
    state.trabajos = [];
  } else {
    state.trabajos = resTrabajos.data.map(row => {
      const t = row.data;
      if(!t.adjuntos) t.adjuntos = [];
      return t;
    });
  }

  if(resCursos.error){
    console.error(resCursos.error);
    state.trabajos.length || (state.loadError = true); // no pisa el error si ya había uno
    state.capacitaciones = [];
  } else {
    state.capacitaciones = resCursos.data.map(row => {
      const c = row.data;
      if(!c.bibliografia) c.bibliografia = [];
      if(!c.preguntas) c.preguntas = [];
      if(!c.resultados) c.resultados = [];
      if(!c.comentarios) c.comentarios = [];
      if(!c.comites){ c.comites = c.comite ? [c.comite] : ['ceti']; }
      return c;
    });
  }

  if(resResidentes.error){
    console.error(resResidentes.error);
    state.residentes = [];
  } else {
    state.residentes = resResidentes.data.map(row => row.data);
  }

  state.loaded = true;
  render();
}

/* ---------------- lógica de estado del trabajo ---------------- */
function ultimaRonda(stage){
  return stage.rounds.length ? stage.rounds[stage.rounds.length-1] : null;
}

function estadoProyecto(t){
  const r = ultimaRonda(t.proyecto);
  if(!r) return 'no_enviado';
  if(r.resultado === 'en_evaluacion') return 'en_evaluacion';
  if(r.resultado === 'no_aprobado') return t.proyecto.rounds.length>=3 ? 'agotado' : 'requiere_correccion';
  if(r.resultado === 'cieis') return 'en_cieis';
  if(r.resultado === 'aprobado') return 'aprobado';
  return 'no_enviado';
}

function proyectoListoParaFinal(t){
  const ep = estadoProyecto(t);
  if(ep !== 'aprobado') return false;
  if(t.requiereCIEIS === true && !t.cieisAprobado) return false;
  return true;
}

function estadoTrabajoFinal(t){
  const r = ultimaRonda(t.trabajoFinal);
  if(!r) return 'no_enviado';
  if(r.resultado === 'en_evaluacion') return 'en_evaluacion';
  if(r.resultado === 'no_aprobado') return t.trabajoFinal.rounds.length>=3 ? 'agotado' : 'requiere_correccion';
  if(r.resultado === 'aprobado') return 'aprobado';
  return 'no_enviado';
}

function estadoGeneral(t){
  const ep = estadoProyecto(t);
  if(ep === 'no_enviado') return {label:'Título registrado — falta enviar proyecto', tone:'pendiente', step:1};
  if(ep === 'en_evaluacion') return {label:'Proyecto en evaluación (ronda '+t.proyecto.rounds.length+')', tone:'pendiente', step:2};
  if(ep === 'requiere_correccion') return {label:'Proyecto — requiere corrección (ronda '+t.proyecto.rounds.length+' de 3)', tone:'no_aprobado', step:2};
  if(ep === 'agotado') return {label:'Proyecto no aprobado tras 3 rondas — revisar viabilidad', tone:'no_aprobado', step:2};
  if(ep === 'en_cieis') return {label:'Proyecto aprobado por CETI — en revisión CIEIS', tone:'pendiente', step:3};
  // ep === 'aprobado'
  if(!proyectoListoParaFinal(t)) return {label:'Proyecto aprobado — pendiente aprobación CIEIS', tone:'pendiente', step:3};
  const ef = estadoTrabajoFinal(t);
  if(ef === 'no_enviado') return {label:'Proyecto aprobado — pendiente enviar trabajo final', tone:'pendiente', step:4};
  if(ef === 'en_evaluacion') return {label:'Trabajo final en evaluación (ronda '+t.trabajoFinal.rounds.length+')', tone:'pendiente', step:4};
  if(ef === 'requiere_correccion') return {label:'Trabajo final — requiere corrección (ronda '+t.trabajoFinal.rounds.length+' de 3)', tone:'no_aprobado', step:4};
  if(ef === 'agotado') return {label:'Trabajo final no aprobado tras 3 rondas — revisar viabilidad', tone:'no_aprobado', step:4};
  // ef === aprobado
  const e = t.entrega;
  if(e.copias && e.firmaCETI && e.firmaCCDI) return {label:'Finalizado — firmado por CETI y CCDI', tone:'aprobado', step:5};
  return {label:'Trabajo final aprobado — pendiente entrega y firmas', tone:'pendiente', step:5};
}

const STEP_LABELS = ['Título','Proyecto','CIEIS','Trabajo final','Entrega/Firma'];

const RESULTADO_ETAPA = {
  no_enviado: { label:'Sin enviar', tone:'neutral' },
  en_evaluacion: { label:'En evaluación', tone:'pendiente' },
  requiere_correccion: { label:'No aprobado — corrección pendiente', tone:'no_aprobado' },
  agotado: { label:'No aprobado (3 rondas agotadas)', tone:'no_aprobado' },
  aprobado: { label:'Aprobado', tone:'aprobado' },
  en_cieis: { label:'Aprobado por CETI — en CIEIS', tone:'pendiente' }
};

function resultadoChips(t){
  const ep = estadoProyecto(t);
  const ef = estadoTrabajoFinal(t);
  const rp = RESULTADO_ETAPA[ep];
  const rf = RESULTADO_ETAPA[ef];
  return `<div class="resultado-chips">
    <span class="resultado-chip badge ${rp.tone}">Proyecto: ${rp.label}</span>
    <span class="resultado-chip badge ${rf.tone}">Trabajo final: ${rf.label}</span>
  </div>`;
}

  const t = state.trabajos.find(x=>x.id===id);

  const s = stage === 'proyecto' ? t.proyecto : t.trabajoFinal;
  if(s.rounds.length >= 3){ alert('Ya se utilizaron las 3 rondas de evaluación permitidas por el POE.'); return; }
  s.rounds.push({ n: s.rounds.length+1, fechaEnvio: today(), evaluador:'', resultado:'en_evaluacion', comentarios:'', fechaResultado:'' });
  await guardarTrabajo(t);
  render();
}

  const t = state.trabajos.find(x=>x.id===id);
  const s = stage === 'proyecto' ? t.proyecto : t.trabajoFinal;

// Vistas que no existen para una cuenta que SOLO pertenece al Comité de
// Calidad (sin ser también CETI): para esas cuentas, Capacitaciones es la
// única sección — como si fuera una plataforma aparte.
const VISTAS_SOLO_CETI = ['alumno', 'ceti', 'impacto', 'residentes', 'biblioteca'];

function setRole(r){
  if(r === 'ceti' && !state.isAdmin){ alert('Tu cuenta no tiene permisos de CETI.'); return; }
  if(VISTAS_SOLO_CETI.includes(r) && state.isCalidad && !state.isAdmin){ return; } // cuenta solo-Calidad: ignorar
  state.role = r; state.selectedId = null; state.selectedCursoId = null; render();
}

// Acciones reservadas a CETI (Vista CETI, Residentes, Impacto). Se basa en
// la cuenta real (tabla roles, comité 'ceti'), no en una clave.
function conAccesoCETI(fn){
  if(state.isAdmin){ fn(); return; }
  alert('Esta acción requiere una cuenta con permisos de CETI.');
}

// Acciones de gestión de Capacitaciones: alcanza con pertenecer a CUALQUIER
// comité (CETI o Calidad) — cada uno administra las suyas.
function conAccesoComite(fn){
  if(state.isAdmin || state.isCalidad){ fn(); return; }
  alert('Esta acción requiere pertenecer a un comité (CETI o Comité de Calidad).');
}

// Puede editar/eliminar/moderar una capacitación puntual si pertenece al
// comité dueño de esa capacitación.
function puedeAdministrarCurso(c){
  const comites = c.comites || ['ceti'];
  return (comites.includes('ceti') && state.isAdmin) || (comites.includes('calidad') && state.isCalidad);
}

const NOMBRE_COMITE = { ceti: 'CETI', calidad: 'Comité de Calidad' };
const TONO_COMITE = { ceti: 'neutral', calidad: 'pendiente' };
function badgesComites(c){
  const comites = c.comites || ['ceti'];
  return comites.map(co => `<span class="badge ${TONO_COMITE[co]||'neutral'}">${NOMBRE_COMITE[co]||co}</span>`).join(' ');
}

/* ---------------- autenticación ---------------- */
async function initAuth(){
  const { data:{ session } } = await sb.auth.getSession();
  state.session = session;
  state.authChecked = true;
  if(session){ await afterLogin(); } else { render(); }

  sb.auth.onAuthStateChange(async (_event, session)=>{
    state.session = session;
    if(session){ await afterLogin(); }
    else{ state.isAdmin = false; state.isCalidad = false; state.loaded = false; render(); }
  });
}

async function afterLogin(){
  await checkRoles();
  // Una cuenta exclusiva de Calidad arranca directo en Capacitaciones:
  // para ella, es la única sección que existe.
  if(state.isCalidad && !state.isAdmin){ state.role = 'capacitaciones'; }
  else if(state.moduloElegido === 'capacitaciones'){ state.role = 'capacitaciones'; }
  else if(state.moduloElegido === 'investigacion'){ state.role = 'alumno'; }
  await loadData();
}

async function checkRoles(){
  state.isAdmin = false;
  state.isCalidad = false;
  if(!state.session) return;
  try{
    const email = state.session.user.email;
    const { data } = await sb.from('roles').select('comite').eq('email', email);
    if(data){
      state.isAdmin = data.some(r => r.comite === 'ceti');
      state.isCalidad = data.some(r => r.comite === 'calidad');
    }
  }catch(e){ /* sin roles */ }
}

function renderAuthScreen(){
  const signup = state.authMode === 'signup';
  return `
  <div class="auth-screen"><div class="auth-shell">
    <div class="auth-brand"><img src="data:image/webp;base64,${EPIDATA_LOGO_B64}" alt="Epidata"></div>
    <div class="auth-card">
      <div class="auth-eyebrow">Módulo activo</div>
      <div class="auth-module-row">
        <div class="auth-badge">CETI</div>
        <h2>${signup ? 'Crear cuenta' : 'CETI'}</h2>
      </div>
      <p class="sub">Seguimiento de trabajos de investigación — Nuevo Hospital San Roque</p>
      <div class="auth-cred-label">Credenciales institucionales</div>
      <div id="auth_error" class="auth-error" style="display:none;"></div>
      <div class="auth-field"><label>Email</label><input id="auth_email" type="email" placeholder="tu-mail@hospital.com"></div>
      <div class="auth-field"><label>Contraseña</label><input id="auth_pass" type="password" placeholder="••••••••" onkeydown="if(event.key==='Enter') ${signup?'registrarse()':'iniciarSesion()'}"></div>
      <button class="auth-submit" onclick="${signup?'registrarse()':'iniciarSesion()'}">${signup?'Crear cuenta':'Ingresar a CETI'}</button>
      <div class="auth-toggle">${signup
        ? '¿Ya tenés cuenta? <a onclick="toggleAuthMode()">Iniciar sesión</a>'
        : '¿No tenés cuenta? <a onclick="toggleAuthMode()">Registrate</a>'}</div>
    </div>
  </div>
  <div class="auth-footnote">Próximamente: más módulos de investigación</div>
  </div>`;
}

function exportarExcel(){
  const filas = state.trabajos.map(t=>{
    const eg = estadoGeneral(t);
    const up = ultimaRonda(t.proyecto);
    const uf = ultimaRonda(t.trabajoFinal);
    return {
      'Número de ingreso': t.numeroIngreso,
      'Fecha de ingreso': t.fechaIngreso,
      'Título': t.titulo,
      'Tipo': t.tipo,
      'Investigador': t.investigador.nombre,
      'Servicio': t.investigador.servicio,
      'Año de residencia': t.investigador.anio,
      'Email': t.investigador.email,
      'Director/Tutor': t.director,
      'Estado general': eg.label,
      'Rondas proyecto': t.proyecto.rounds.length,
      'Último resultado proyecto': up ? up.resultado : '',
      'Requiere CIEIS': t.requiereCIEIS===true ? 'Sí' : t.requiereCIEIS===false ? 'No' : 'Sin definir',
      'CIEIS aprobado': t.cieisAprobado ? 'Sí' : 'No',
      'Rondas trabajo final': t.trabajoFinal.rounds.length,
      'Último resultado trabajo final': uf ? uf.resultado : '',
      'Copias entregadas': t.entrega.copias ? 'Sí' : 'No',
      'Firma CETI': t.entrega.firmaCETI ? 'Sí' : 'No',
      'Firma CCDI': t.entrega.firmaCCDI ? 'Sí' : 'No',
      'Fecha de firma': t.entrega.fecha
    };
  });
  const ws = XLSX.utils.json_to_sheet(filas);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Expedientes CETI');
  XLSX.writeFile(wb, 'expedientes_ceti_'+today()+'.xlsx');
}

function exportarPDF(){ window.print(); }

function formatSize(bytes){
  if(bytes < 1024) return bytes + ' B';
  if(bytes < 1024*1024) return Math.round(bytes/1024) + ' KB';
  return (bytes/(1024*1024)).toFixed(1) + ' MB';
}

      <div class="field"><label>Nombre del documento</label><input id="a_link_nombre" type="text" placeholder="Ej: Consentimiento informado escaneado"></div>
      <div class="field"><label>Link (debe empezar con http:// o https://)</label><input id="a_link_url" type="text" placeholder="https://drive.google.com/..."></div>
      <p style="font-size:12px; color:var(--ink-soft); margin-top:-6px;">Asegurate de que el link tenga permisos para que CETI pueda abrirlo (compartir como "Cualquiera con el enlace").</p>
    </div>

    <div class="field"><label>Subido por</label><input id="a_subidopor" type="text" value="${esc(state.miNombre || (state.role==='ceti'?'CETI':''))}"></div>
    <p id="a_error" style="color:var(--brick); font-size:13px; display:none;"></p>
    <div class="modal-actions">
      <button class="btn secondary" onclick="cerrarModal()">Cancelar</button>
      <button class="btn" id="a_btn" onclick="confirmarAdjunto('${trabajoId}')">Guardar</button>
    </div>
  `;
  document.getElementById('overlay').classList.add('open');
}

function cambiarModoAdjunto(){
  const modo = document.getElementById('a_modo').value;
  document.getElementById('a_modo_archivo').style.display = modo === 'archivo' ? 'block' : 'none';
  document.getElementById('a_modo_link').style.display = modo === 'link' ? 'block' : 'none';
}

function confirmarAdjunto(trabajoId){
  const modo = document.getElementById('a_modo').value;
  if(modo === 'link') guardarAdjuntoLink(trabajoId);
  else subirAdjunto(trabajoId);
}

async function guardarAdjuntoLink(trabajoId){
  const errorEl = document.getElementById('a_error');
  errorEl.style.display = 'none';
  const nombre = document.getElementById('a_link_nombre').value.trim();
  const url = document.getElementById('a_link_url').value.trim();
  if(!nombre || !url){ errorEl.textContent='Completá el nombre y el link.'; errorEl.style.display='block'; return; }
  if(!/^https?:\/\//i.test(url)){ errorEl.textContent='El link debe empezar con http:// o https://'; errorEl.style.display='block'; return; }
  const t = state.trabajos.find(x=>x.id===trabajoId);
  t.adjuntos.push({
    id: uid(),
    nombre,
    tipo: 'link',
    url,
    categoria: document.getElementById('a_categoria').value,
    subidoPor: document.getElementById('a_subidopor').value.trim() || '—',
    fecha: today()
  });
  await guardarTrabajo(t);
  cerrarModal();
  render();
}

async function subirAdjunto(trabajoId){
  const fileInput = document.getElementById('a_file');
  const file = fileInput.files[0];
  const errorEl = document.getElementById('a_error');
  errorEl.style.display = 'none';
  if(!file){ errorEl.textContent = 'Elegí un archivo.'; errorEl.style.display='block'; return; }
  if(file.size > TAMANO_MAX_MB*1024*1024){
    errorEl.textContent = `Este archivo pesa ${formatSize(file.size)}. El máximo configurado acá es ${TAMANO_MAX_MB} MB.`;
    errorEl.style.display = 'block';
    return;
  }
  const btn = document.getElementById('a_btn');
  btn.disabled = true; btn.textContent = 'Subiendo…';

  try{
    const adjId = uid();
    const path = trabajoId + '/' + adjId + '_' + file.name;
    const { error: upErr } = await sb.storage.from(BUCKET).upload(path, file);
    if(upErr) throw upErr;
    const { data: urlData } = sb.storage.from(BUCKET).getPublicUrl(path);

    const t = state.trabajos.find(x=>x.id===trabajoId);
    t.adjuntos.push({
      id: adjId,
      nombre: file.name,
      tipo: 'archivo',
      mimeType: file.type || 'application/octet-stream',
      size: file.size,
      path: path,
      url: urlData.publicUrl,
      categoria: document.getElementById('a_categoria').value,
      subidoPor: document.getElementById('a_subidopor').value.trim() || '—',
      fecha: today()
    });
    await guardarTrabajo(t);
    cerrarModal();
    render();
  }catch(e){
    console.error(e);
    errorEl.textContent = 'No se pudo subir el archivo: ' + (e.message || 'error desconocido') + '. Probá de nuevo o usá la opción de link.';
    errorEl.style.display = 'block';
    btn.disabled = false; btn.textContent = 'Guardar';
  }
}

function descargarAdjunto(adjId, nombre, mimeType, tipo, url){
  if(!url){ alert('No se encontró el archivo.'); return; }
  const a = document.createElement('a');
  a.href = url;
  a.download = nombre;
  a.target = '_blank';
  a.rel = 'noopener';
  document.body.appendChild(a);
  a.click();
  a.remove();
}

async function eliminarAdjunto(trabajoId, adjId){
  if(!confirm('¿Eliminar este documento?')) return;
  const t = state.trabajos.find(x=>x.id===trabajoId);
  const adj = t.adjuntos.find(a=>a.id===adjId);
  t.adjuntos = t.adjuntos.filter(a=>a.id!==adjId);
  if(adj && adj.tipo === 'archivo' && adj.path){
    try{ await sb.storage.from(BUCKET).remove([adj.path]); }catch(e){ /* puede no existir */ }
  }
  await guardarTrabajo(t);
  render();
}

function renderAdjuntos(t){
  const lista = t.adjuntos.length ? t.adjuntos.map(a => `
    <div class="doc-item">
      <div class="doc-info">
        <div class="doc-name">${esc(a.nombre)}${a.tipo==='link' ? ' <span style="color:var(--ink-soft); font-weight:400;">(enlace externo)</span>' : ''}</div>
        <div class="doc-meta">${esc(a.categoria)} · ${a.tipo==='link' ? 'enlace' : formatSize(a.size)} · subido por ${esc(a.subidoPor)} el ${fmtDate(a.fecha)}</div>
      </div>
      <div class="doc-actions">
        <button class="btn secondary small" onclick="descargarAdjunto('${a.id}','${esc(a.nombre).replace(/'/g,"\\'")}','${a.mimeType||''}','${a.tipo||'archivo'}','${a.url||''}')">${a.tipo==='link' ? 'Abrir' : 'Ver/Descargar'}</button>
        <button class="btn danger small" onclick="eliminarAdjunto('${t.id}','${a.id}')">Eliminar</button>
      </div>
    </div>
  `).join('') : `<p style="font-size:13px; color:var(--ink-soft);">Todavía no se agregó ningún documento.</p>`;

  return `<div class="panel">
    <div class="exp-top"><div class="section-title">Documentos adjuntos</div>
      <button class="btn secondary small" onclick="abrirModalAdjunto('${t.id}')">+ Agregar documento</button>
    </div>
    ${lista}
  </div>`;
}

    </header>
    <div class="roletabs">
      ${(!state.isCalidad || state.isAdmin) ? `<button class="roletab ${state.role==='alumno'?'active':''}" onclick="setRole('alumno')">Vista Alumno</button>` : ''}
      ${state.isAdmin ? `<button class="roletab ${state.role==='ceti'?'active':''}" onclick="setRole('ceti')">Vista CETI</button>` : ''}
      <button class="roletab ${state.role==='capacitaciones'?'active':''}" onclick="setRole('capacitaciones')">Capacitaciones</button>

    body = renderBiblioteca();
  } else if(state.role === 'residentes'){
    body = renderListaResidentes();
  } else if(state.role === 'impacto'){
    body = renderImpacto();
  } else if(state.role === 'capacitaciones'){
    body = state.selectedCursoId ? renderDetalleCurso(state.selectedCursoId) : renderListaCapacitaciones();
  } else if(state.selectedId){
    body = renderDetalle(state.selectedId);
  } else if(state.role === 'alumno'){
    body = renderListaAlumno();
  } else {
    body = renderListaCETI();
  }

function renderListaAlumno(){
  const filtro = state.filterText.toLowerCase();

function stepperHtml(currentStep, tone){
  return `<div class="stepper">` + STEP_LABELS.map((lbl,i)=>{
    const n = i+1;
    let cls = '';
    if(n < currentStep) cls = 'done';
    else if(n === currentStep) cls = (tone==='no_aprobado') ? 'warn' : 'current';
    return `<div class="step ${cls}"><div class="dot"></div><div class="lbl">${lbl}</div></div>`;
  }).join('') + `</div>`;
}

function stageBlock(t, stageKey, titulo, isCETI, habilitado){
  const s = t[stageKey];
  const estado = stageKey==='proyecto' ? estadoProyecto(t) : estadoTrabajoFinal(t);
  const ultima = ultimaRonda(s);
  const puedeEnviar = habilitado && s.rounds.length < 3 && (!ultima || ultima.resultado === 'no_aprobado');

  let rondas = s.rounds.map(r=>{
    const resLabel = {aprobado:'Aprobado', no_aprobado:'No aprobado', en_evaluacion:'En evaluación', cieis:'Continuar por CIEIS'}[r.resultado] || r.resultado;
    const tone = r.resultado==='aprobado' ? 'aprobado' : r.resultado==='no_aprobado' ? 'no_aprobado' : 'pendiente';
    return `<div class="round">
      <div class="round-top"><span>Ronda ${r.n} · enviado ${fmtDate(r.fechaEnvio)}</span><span class="badge ${tone}">${resLabel}</span></div>
      <div class="round-body">
        ${r.evaluador ? `<p><strong>Evaluador/a:</strong> ${esc(r.evaluador)}</p>` : ''}
        ${r.comentarios ? `<p><strong>Comentarios:</strong> ${esc(r.comentarios)}</p>` : ''}
        ${r.fechaResultado ? `<p><strong>Resultado registrado:</strong> ${fmtDate(r.fechaResultado)}</p>` : ''}
        ${isCETI && r.resultado==='en_evaluacion' ? `<button class="btn small" onclick="abrirModalResultado('${t.id}','${stageKey}')">Registrar resultado</button>` : ''}
      </div>
    </div>`;
  }).join('');

  let aviso = '';
  if(!habilitado && s.rounds.length===0){
    aviso = `<p style="font-size:13px; color:var(--ink-soft);">Se habilita cuando la etapa anterior esté aprobada.</p>`;
  }
  if(estado === 'agotado'){
    aviso = `<div class="warn-box">Se agotaron las 3 rondas de evaluación previstas por el POE. Corresponde revisar junto al director/tutor la viabilidad del tema.</div>`;
  }

  return `<div class="panel">
    <div class="exp-top"><div class="section-title">${titulo}</div></div>
    ${aviso}
    ${rondas || (habilitado ? '' : '')}
    ${!isCETI && puedeEnviar ? `<button class="btn secondary small" onclick="enviarAEvaluacion('${t.id}','${stageKey}')">Enviar ${stageKey==='proyecto'?'proyecto':'trabajo final'} a evaluación</button>` : ''}
    ${!s.rounds.length && !habilitado ? '' : ''}
  </div>`;
}

// Convierte distintos formatos de link de YouTube a una URL de embed.
// Si no reconoce el formato, devuelve null.
function youtubeEmbedUrl(url){
  if(!url) return null;
  let id = null;
  const patterns = [
    /youtu\.be\/([A-Za-z0-9_-]{6,})/,
    /youtube\.com\/watch\?v=([A-Za-z0-9_-]{6,})/,
    /youtube\.com\/embed\/([A-Za-z0-9_-]{6,})/,
    /youtube\.com\/shorts\/([A-Za-z0-9_-]{6,})/
  ];
  for(const re of patterns){
    const m = url.match(re);
    if(m){ id = m[1]; break; }
  }
  return id ? `https://www.youtube.com/embed/${id}` : null;
}

// Formato esperado, una referencia por línea: "Título | https://link"
// (el link es opcional).
function parseBibliografia(texto){
  return texto.split('\n').map(l=>l.trim()).filter(Boolean).map(linea=>{
    const partes = linea.split('|').map(p=>p.trim());
    return { titulo: partes[0], url: partes[1] || '' };
  });
}
function bibliografiaATexto(lista){
  return (lista||[]).map(b => b.url ? `${b.titulo} | ${b.url}` : b.titulo).join('\n');
}

// Formato esperado, preguntas separadas por una línea en blanco:
// P: ¿Cuál es la vía de transmisión más común?
// A) Respiratoria
// B) Fecal-oral
// C) Sanguínea
// R: A
function parsePreguntas(texto){
  const bloques = texto.split(/\n\s*\n/).map(b=>b.trim()).filter(Boolean);
  const preguntas = [];
  for(const bloque of bloques){
    const lineas = bloque.split('\n').map(l=>l.trim()).filter(Boolean);
    let pregunta = '', opciones = [], correctaIndex = -1;
    for(const linea of lineas){
      if(/^P:/i.test(linea)) pregunta = linea.replace(/^P:/i,'').trim();
      else if(/^[A-Za-z]\)/.test(linea)) opciones.push(linea.replace(/^[A-Za-z]\)/,'').trim());
      else if(/^R:/i.test(linea)){
        const letra = linea.replace(/^R:/i,'').trim().toUpperCase();
        correctaIndex = letra.charCodeAt(0) - 65;
      }
    }
    if(pregunta && opciones.length>=2 && correctaIndex>=0 && correctaIndex<opciones.length){
      preguntas.push({ pregunta, opciones, correctaIndex });
    }
  }
  return preguntas;
}
function preguntasATexto(lista){
  return (lista||[]).map(p=>{
    const letras = 'ABCDEFGH';
    const opts = p.opciones.map((o,i)=>`${letras[i]}) ${o}`).join('\n');
    return `P: ${p.pregunta}\n${opts}\nR: ${letras[p.correctaIndex]}`;
  }).join('\n\n');
}

async function guardarCursoDesdeForm(cursoId){
  const titulo = document.getElementById('c_titulo').value.trim();
  if(!titulo){ alert('Ponele un título al curso.'); return; }
  const checks = Array.from(document.querySelectorAll('.c_comite_check'));
  const comites = checks
    .filter(el => el.dataset.fijo === '1' || el.checked)
    .map(el => el.value);
  if(comites.length === 0){ alert('Elegí al menos un comité para esta capacitación.'); return; }
  const datos = {
    titulo,
    descripcion: document.getElementById('c_descripcion').value.trim(),
    youtubeUrl: document.getElementById('c_youtube').value.trim(),
    bibliografia: parseBibliografia(document.getElementById('c_biblio').value),
    preguntas: parsePreguntas(document.getElementById('c_preguntas').value),
    comites
  };
  let c;
  if(cursoId){
    c = state.capacitaciones.find(x=>x.id===cursoId);
    Object.assign(c, datos);
  } else {
    c = nuevoCurso(datos);
    state.capacitaciones.unshift(c);
  }
  const ok = await guardarCurso(c);
  if(!ok) return;
  cerrarModal();
  state.selectedCursoId = c.id;
  render();
}

      <button class="btn danger small" onclick="eliminarCurso('${c.id}')">Eliminar</button>
    </div>` : ''}
  </div>`;

  html += `<div class="panel">
    <div class="curso-meta" style="margin-bottom:10px;">${badgesComites(c)}</div>
    <h2>${esc(c.titulo)}</h2>
    ${c.descripcion ? `<p style="margin-top:8px; color:var(--ink-soft);">${esc(c.descripcion)}</p>` : ''}
    ${embed ? `<div class="video-wrap"><iframe src="${embed}" allowfullscreen title="${esc(c.titulo)}"></iframe></div>` :
      (c.youtubeUrl ? `<p style="font-size:13px; color:var(--brick); margin-top:12px;">El link de video no se reconoce como un link válido de YouTube.</p>` : '')}
  </div>`;

  if(c.bibliografia.length){
    html += `<div class="panel">
      <div class="section-title">Bibliografía</div>
      ${c.bibliografia.map(b => `<div class="biblio-item">${b.url ? `<a href="${esc(b.url)}" target="_blank" rel="noopener">${esc(b.titulo)}</a>` : esc(b.titulo)}</div>`).join('')}
    </div>`;
  }

  html += renderCuestionario(c);

  if(puedeAdmin && c.resultados.length){
    const filas = [...c.resultados].sort((a,b)=> (b.fecha||'').localeCompare(a.fecha||''));
    html += `<div class="panel">
      <div class="section-title">Resultados registrados</div>
      ${filas.map(r => `<div class="resultado-row"><span>${esc(r.nombre)} — ${fmtDate(r.fecha)}</span><span>${r.puntaje}/${r.total} · <span class="badge ${esAprobado(r.puntaje,r.total)?'aprobado':'no_aprobado'}" style="font-size:10.5px;">${esAprobado(r.puntaje,r.total)?'Aprobado':'No aprobado'}</span></span></div>`).join('')}
    </div>`;
  }

  html += renderComentariosCurso(c);

  return html;
}

function renderCuestionario(c){
  if(!c.preguntas.length){
    return `<div class="panel"><div class="section-title">Cuestionario</div><p style="font-size:13px; color:var(--ink-soft);">Esta capacitación todavía no tiene cuestionario cargado.</p></div>`;
  }

  if(state.quizResultado && state.quizResultado.cursoId === c.id){
    const r = state.quizResultado;
    return `<div class="panel">
      <div class="section-title">Cuestionario</div>
      <div class="quiz-score">${r.puntaje} / ${r.total} correctas</div>
      <div class="badge ${esAprobado(r.puntaje,r.total)?'aprobado':'no_aprobado'}" style="margin-bottom:14px;">${esAprobado(r.puntaje,r.total) ? `Aprobado (mínimo ${Math.round(UMBRAL_APROBACION*r.total)}/${r.total})` : `No aprobado — necesitás al menos ${Math.round(UMBRAL_APROBACION*r.total)} de ${r.total} correctas`}</div>
      ${c.preguntas.map((p,i)=>{
        const marcada = r.respuestas[i];
        const ok = marcada === p.correctaIndex;
        return `<div class="quiz-q ${ok?'correcta':'incorrecta'}">
          <div class="q-titulo">${i+1}. ${esc(p.pregunta)}</div>
          ${p.opciones.map((op,j)=>`<div style="font-size:13.5px; ${j===p.correctaIndex?'font-weight:600;':''} ${j===marcada && !ok ? 'text-decoration:line-through;':''}">${j===p.correctaIndex?'✓ ':''}${esc(op)}</div>`).join('')}
        </div>`;
      }).join('')}
      <div style="display:flex; gap:10px; flex-wrap:wrap; margin-top:4px;">
        ${esAprobado(r.puntaje,r.total) ? `<button class="btn small" onclick="descargarCertificado('${c.id}')">Descargar certificado</button>` : ''}
        <button class="btn secondary small" onclick="state.quizResultado=null; render();">Volver a intentar</button>
      </div>
    </div>`;
  }

  return `<div class="panel">
    <div class="section-title">Cuestionario</div>
    <div class="field"><label>Tu nombre</label><input id="quiz_nombre" type="text" value="${esc(state.miNombre)}"></div>
    ${c.preguntas.map((p,i)=>`
      <div class="quiz-q">
        <div class="q-titulo">${i+1}. ${esc(p.pregunta)}</div>
        ${p.opciones.map((op,j)=>`<label><input type="radio" name="quiz_p${i}" value="${j}"> ${esc(op)}</label>`).join('')}
      </div>
    `).join('')}
    <button class="btn" onclick="enviarCuestionario('${c.id}')">Enviar respuestas</button>
  </div>`;
}

async function enviarCuestionario(cursoId){
  const c = state.capacitaciones.find(x=>x.id===cursoId);
  const nombre = document.getElementById('quiz_nombre').value.trim();
  if(!nombre){ alert('Ingresá tu nombre antes de enviar.'); return; }

  const respuestas = [];
  let puntaje = 0;
  for(let i=0;i<c.preguntas.length;i++){
    const marcado = document.querySelector(`input[name="quiz_p${i}"]:checked`);
    const val = marcado ? parseInt(marcado.value,10) : -1;
    respuestas.push(val);
    if(val === c.preguntas[i].correctaIndex) puntaje++;
  }
  if(respuestas.some(r=>r===-1)){
    if(!confirm('Dejaste alguna pregunta sin responder. ¿Enviar igual?')) return;
  }

  saveNombre(nombre);
  c.resultados.push({ nombre, puntaje, total: c.preguntas.length, fecha: today() });
  await guardarCurso(c);
  state.quizResultado = { cursoId, puntaje, total: c.preguntas.length, respuestas, nombre, fecha: today() };
  render();
}

function nombreComiteCompleto(c){
  const comites = c.comites || ['ceti'];
  const nombres = {
    ceti: 'Comisión Evaluadora de Trabajos de Investigación (CETI)',
    calidad: 'Comité de Calidad y Seguridad del Paciente'
  };
  return comites.map(co => nombres[co] || co).join(' · ');
}

function descargarCertificado(cursoId){
  const c = state.capacitaciones.find(x=>x.id===cursoId);
  const r = state.quizResultado;
  if(!c || !r || r.cursoId !== cursoId){ alert('No se encontró el resultado para generar el certificado.'); return; }
  if(!esAprobado(r.puntaje, r.total)){ alert('El certificado solo se emite si se aprueba el cuestionario (mínimo 60%).'); return; }
  if(!window.jspdf){ alert('No se pudo cargar el generador de PDF. Recargá la página y probá de nuevo.'); return; }

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation:'landscape', unit:'mm', format:'a4' });
  const W = 297, H = 210;
  const accent = [108,99,255];
  const ink = [34,32,27];
  const soft = [110,110,110];

  doc.setDrawColor(...accent);
  doc.setLineWidth(1.1);
  doc.rect(10,10,W-20,H-20);
  doc.setLineWidth(0.25);
  doc.rect(14,14,W-28,H-28);

  doc.setFont('times','bold');
  doc.setFontSize(13);
  doc.setTextColor(...accent);
  doc.text('EPIDATA', W/2, 32, { align:'center' });

  doc.setFont('helvetica','normal');
  doc.setFontSize(10);
  doc.setTextColor(...soft);
  doc.text(nombreComiteCompleto(c) + ' — Nuevo Hospital San Roque', W/2, 39, { align:'center' });

  doc.setFont('times','bold');
  doc.setFontSize(30);
  doc.setTextColor(...ink);
  doc.text('Certificado de Finalización', W/2, 68, { align:'center' });

  doc.setFont('helvetica','normal');
  doc.setFontSize(13);
  doc.setTextColor(...soft);
  doc.text('Se certifica que', W/2, 92, { align:'center' });

  doc.setFont('times','bolditalic');
  doc.setFontSize(27);
  doc.setTextColor(...ink);
  doc.text(r.nombre, W/2, 107, { align:'center' });

  doc.setFont('helvetica','normal');
  doc.setFontSize(13);
  doc.setTextColor(...soft);
  doc.text('completó satisfactoriamente la capacitación', W/2, 120, { align:'center' });

  doc.setFont('times','bold');
  doc.setFontSize(17);
  doc.setTextColor(...ink);
  const tituloLineas = doc.splitTextToSize(c.titulo, W-90);
  doc.text(tituloLineas, W/2, 133, { align:'center' });

  const yPuntaje = 133 + (tituloLineas.length-1)*7.5 + 13;
  doc.setFont('helvetica','normal');
  doc.setFontSize(12);
  doc.setTextColor(...soft);
  doc.text(`Puntaje obtenido: ${r.puntaje} / ${r.total}`, W/2, yPuntaje, { align:'center' });

  doc.setFontSize(10);
  doc.setTextColor(150,150,150);
  doc.text(`${fmtDate(r.fecha)}`, W/2, H-24, { align:'center' });

  const nombreArchivo = `Certificado - ${c.titulo} - ${r.nombre}.pdf`.replace(/[\\/:*?"<>|]/g,'');
  doc.save(nombreArchivo);
}

/* ---------------- biblioteca ---------------- */

function fechaAprobacionFinal(t){
  const r = ultimaRonda(t.trabajoFinal);
  return r && r.fechaResultado ? r.fechaResultado : '';
}

function abrirAdjuntoBiblioteca(trabajoId, adjId){
  const t = state.trabajos.find(x=>x.id===trabajoId);
  const a = t && (t.adjuntos || []).find(x=>x.id===adjId);
  if(!a){ alert('No se encontró el archivo.'); return; }
  descargarAdjunto(a.id, a.nombre, a.mimeType, a.tipo, a.url);
}

function abrirExpedienteDesdeBiblioteca(id){
  if(!state.isAdmin) return;
  state.role = 'ceti';
  state.selectedId = id;
  render();
}

async function toggleAutorizaDifusion(id, valor){
  const t = state.trabajos.find(x=>x.id===id);
  if(!t || !state.isAdmin) return;
  t.autorizaDifusion = !!valor;
  t.fechaAutorizacion = valor ? today() : '';
  await guardarTrabajo(t);
  render();
}

function cardBiblioteca(t){
  const docs = (t.adjuntos || []).filter(a => a.categoria === 'Trabajo final');
  const fecha = fechaAprobacionFinal(t);
  const botones = docs.length
    ? docs.map(a => `<button class="btn secondary small" onclick="abrirAdjuntoBiblioteca('${t.id}','${a.id}')">${a.tipo==='link' ? 'Abrir enlace' : 'Ver / descargar'}${docs.length>1 ? ' · ' + esc(a.nombre) : ''}</button>`).join(' ')
    : `<span style="font-size:12.5px; color:var(--ink-soft);">El documento todavía no está cargado en el expediente.</span>`;
  return `<div class="expediente aprobado" style="cursor:default;">
    <div class="exp-top">
      <div>
        <h3>${esc(t.titulo)}</h3>
        <div class="exp-meta">${esc(t.tipo)} · ${esc(t.investigador.nombre)}${t.investigador.servicio ? ' · ' + esc(t.investigador.servicio) : ''}${t.investigador.anio ? ' · ' + esc(t.investigador.anio) : ''}</div>
        <div class="exp-meta">${t.director ? 'Director/Tutor: ' + esc(t.director) + ' · ' : ''}Aprobado${fecha ? ' el ' + fmtDate(fecha) : ''}</div>
      </div>
    </div>
    <div style="margin-top:10px; display:flex; gap:8px; flex-wrap:wrap;">${botones}</div>
  </div>`;
}

function renderBiblioteca(){
  const q = (state.filterBiblio || '').trim().toLowerCase();
  const aprobados = state.trabajos.filter(t => estadoTrabajoFinal(t) === 'aprobado');
  const coincide = t => !q || [t.titulo, t.tipo, t.director, t.investigador.nombre, t.investigador.servicio, t.investigador.anio]
    .some(v => (v || '').toLowerCase().includes(q));
  const porFecha = (a, b) => (fechaAprobacionFinal(b) || '').localeCompare(fechaAprobacionFinal(a) || '');

  const publicados = aprobados.filter(t => t.autorizaDifusion && coincide(t)).sort(porFecha);
  const totalPublicados = aprobados.filter(t => t.autorizaDifusion).length;
  const pendientes = aprobados.filter(t => !t.autorizaDifusion).sort(porFecha);

  let html = `<div class="panel">
    <h2>Biblioteca</h2>
    <p style="margin-top:8px; color:var(--ink-soft);">Trabajos finales aprobados por la Comisión, cuyos autores autorizaron su difusión. ${totalPublicados} ${totalPublicados === 1 ? 'trabajo publicado' : 'trabajos publicados'}.</p>
  </div>
  <div class="toolbar">
    <input type="text" placeholder="Buscar por título, autor, servicio o director…" value="${esc(state.filterBiblio)}" data-focuskey="buscar-biblio" oninput="state.filterBiblio=this.value; render();">
  </div>`;

  if(!publicados.length){
    html += `<div class="empty">${totalPublicados === 0
      ? 'Todavía no hay trabajos en la Biblioteca. Aparecen acá cuando el trabajo final está aprobado y el autor autorizó su difusión.'
      : 'No hay trabajos que coincidan con la búsqueda.'}</div>`;
  } else {
    html += publicados.map(cardBiblioteca).join('');
  }

  if(state.isAdmin && pendientes.length){
    html += `<div class="panel" style="margin-top:22px;">
      <div class="section-title">Aprobados, pendientes de autorización del autor (solo lo ve la Comisión)</div>
      ${pendientes.map(t => `<div class="resultado-row"><span>${esc(t.titulo)} — ${esc(t.investigador.nombre)}</span><button class="btn secondary small" onclick="abrirExpedienteDesdeBiblioteca('${t.id}')">Abrir expediente</button></div>`).join('')}
    </div>`;
  }
  return html;
}

/* ---------------- impacto ---------------- */

// Estimación conservadora, con la misma metodología usada para la feria:
// 4.5 g CO2e por hoja producida (ISO 14040/44, PAS 2050, marco CEPI) + 1 g
// CO2e por energía de impresión = 5.5 g por hoja evitada.
const GR_CO2_POR_HOJA = 5.5;
const HOJAS_POR_TRABAJO = 8;      // planillas administrativas evitadas por expediente
const HOJAS_POR_CUESTIONARIO = 2; // hoja de examen + certificado evitados por intento

function calcularImpacto(){
  const totalTrabajos = state.trabajos.length;
  const totalCursos = state.capacitaciones.length;
  const totalIntentos = state.capacitaciones.reduce((acc, c) => acc + (c.resultados ? c.resultados.length : 0), 0);
  const totalAdjuntosDigitales = state.trabajos.reduce((acc, t) => acc + (t.adjuntos ? t.adjuntos.length : 0), 0);

  const hojasEvitadas = (totalTrabajos * HOJAS_POR_TRABAJO) + (totalIntentos * HOJAS_POR_CUESTIONARIO);
  const co2EvitadoGr = hojasEvitadas * GR_CO2_POR_HOJA;
  const co2EvitadoKg = co2EvitadoGr / 1000;

  return { totalTrabajos, totalCursos, totalIntentos, totalAdjuntosDigitales, hojasEvitadas, co2EvitadoKg };
}

function renderImpacto(){
  const d = calcularImpacto();
  return `
  <div class="panel">
    <h2>Impacto en vivo</h2>
    <p style="margin-top:8px; color:var(--ink-soft);">Datos reales de este sistema, calculados al momento — no una proyección.</p>
  </div>

  <div class="stats" style="margin-top:4px;">
    <div class="stat"><div class="n mono" style="font-size:40px;">${d.totalTrabajos}</div><div class="l">Trabajos de investigación gestionados</div></div>
    <div class="stat"><div class="n mono" style="font-size:40px;">${d.totalIntentos}</div><div class="l">Cuestionarios de capacitación completados</div></div>
    <div class="stat"><div class="n mono" style="font-size:40px;">${d.totalCursos}</div><div class="l">Capacitaciones publicadas</div></div>
    <div class="stat"><div class="n mono" style="font-size:40px;">${d.totalAdjuntosDigitales}</div><div class="l">Documentos digitalizados</div></div>
  </div>

  <div class="panel" style="border-left:5px solid var(--moss);">
    <div class="section-title">Papel evitado (estimado)</div>
    <div style="display:flex; gap:32px; flex-wrap:wrap; margin-top:10px;">
      <div>
        <div style="font-family:'Source Serif 4',serif; font-size:40px; font-weight:600; color:var(--moss);">${d.hojasEvitadas.toLocaleString('es-AR')}</div>
        <div style="font-size:13px; color:var(--ink-soft);">hojas de papel</div>
      </div>
      <div>
        <div style="font-family:'Source Serif 4',serif; font-size:40px; font-weight:600; color:var(--moss);">${d.co2EvitadoKg.toFixed(1)}</div>
        <div style="font-size:13px; color:var(--ink-soft);">kg de CO2 equivalente</div>
      </div>
    </div>
    <p style="font-size:12px; color:var(--ink-soft); margin-top:16px; margin-bottom:0;">
      Estimado con ${HOJAS_POR_TRABAJO} hojas administrativas evitadas por expediente y ${HOJAS_POR_CUESTIONARIO} por cuestionario completado, a ${GR_CO2_POR_HOJA} g de CO2e por hoja
      (producción de papel + energía de impresión). No incluye la reducción de papel en la gestión de camas de UTI, calculada aparte.
    </p>
  </div>
  `;
}

      </div>
      <div class="comentario-texto">${esc(cm.texto)}</div>
    </div>
  `).join('') : `<p style="font-size:13px; color:var(--ink-soft);">Todavía no hay preguntas ni comentarios en esta capacitación. ¡Sé el primero!</p>`;

async function enviarComentarioCurso(cursoId){
  const c = state.capacitaciones.find(x=>x.id===cursoId);
  const nombre = document.getElementById('cmt_nombre_'+cursoId).value.trim();
  const texto = document.getElementById('cmt_texto_'+cursoId).value.trim();
  if(!nombre || !texto){ alert('Completá tu nombre y el comentario antes de publicar.'); return; }
  saveNombre(nombre);
  c.comentarios.push({ id: uid(), nombre, texto, fecha: today() });
  await guardarCurso(c);
  render();
}

async function eliminarComentarioCurso(cursoId, comentarioId){
  if(!confirm('¿Eliminar este comentario?')) return;
  const c = state.capacitaciones.find(x=>x.id===cursoId);
  c.comentarios = c.comentarios.filter(cm=>cm.id!==comentarioId);
  await guardarCurso(c);
  render();
}

function abrirModalResidente(residenteId){
  const r = residenteId ? state.residentes.find(x=>x.id===residenteId) : null;
  document.getElementById('modalBody').innerHTML = `
    <h2>${r ? 'Editar residente' : 'Agregar residente'}</h2>

async function guardarResidenteDesdeForm(residenteId){
  const nombre = document.getElementById('res_nombre').value.trim();
  if(!nombre){ alert('Ponele un nombre al residente.'); return; }
  const datos = {
    nombre,
    servicio: document.getElementById('res_servicio').value.trim(),
    anio: document.getElementById('res_anio').value.trim(),
    estado: document.getElementById('res_estado').value,
    notas: document.getElementById('res_notas').value.trim()
  };
  let r;
  if(residenteId){
    r = state.residentes.find(x=>x.id===residenteId);
    Object.assign(r, datos);
  } else {
    r = nuevoResidente(datos);
    state.residentes.unshift(r);
  }
  const ok = await guardarResidente(r);
  if(!ok) return;
  cerrarModal();
  render();
}

        <div>
          <h3>${esc(r.nombre)}</h3>
          <div class="exp-meta">${r.anio ? esc(r.anio) : 'Año no especificado'}${r.servicio ? ' · '+esc(r.servicio) : ''}</div>
          ${r.notas ? `<div class="exp-meta" style="margin-top:4px;">${esc(r.notas)}</div>` : ''}
        </div>
        <div style="display:flex; align-items:center; gap:10px;">
          <span class="badge ${r.estado === 'completo' ? 'aprobado' : 'pendiente'}">${r.estado === 'completo' ? 'Completo' : 'Pendiente'}</span>
          ${state.isAdmin ? `<button class="btn danger small" onclick="event.stopPropagation(); eliminarResidente('${r.id}')">Eliminar</button>` : ''}
        </div>
      </div>
    </div>
  `).join('');

  return `<div class="panel">
    <h2>Residentes</h2>
    <p style="margin-top:8px; color:var(--ink-soft);">Listado de residentes y su estado de cumplimiento actual frente al POE de la CETI.${state.isAdmin ? ' Tocá un residente para editarlo.' : ''}</p>
  </div>` + toolbar + filas;
}

/* ---------------- init ---------------- */
initAuth();
</script>
</body>
</html>
